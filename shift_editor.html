<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>แก้ไขกะพนักงาน</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Tahoma", "Segoe UI", sans-serif;
    background: #0f0f14;
    margin: 0;
    padding: 32px;
    color: #e6e6e6;
  }
  .content { max-width: 700px; margin: 0 auto; }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 6px;
    color: #fff;
  }
  .back-link {
    font-size: 13px;
    color: #9a9aa8;
    text-decoration: none;
  }
  .back-link:hover { color: #fff; }

  .add-form {
    background: #15151a;
    border: 1px solid #2a2a35;
    border-radius: 14px;
    padding: 18px;
    margin: 20px 0;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  select, input {
    background: #1a1a22;
    border: 1px solid #2a2a35;
    color: #e6e6e6;
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 13px;
    font-family: inherit;
  }
  input[list] { width: 240px; }
  select { width: 110px; }
  button {
    background: #6366f1;
    border: none;
    color: #fff;
    padding: 9px 18px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #5457e0; }

  .table-wrap {
    background: #15151a;
    border: 1px solid #2a2a35;
    border-radius: 14px;
    overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 12px 16px; font-size: 13px; text-align: left; }
  th { background: #1a1a22; color: #9a9aa8; font-weight: 500; }
  tr { border-bottom: 1px solid #21212a; }
  tr:last-child { border-bottom: none; }
  .shift-tag {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
  }
  .shift-select {
    background: #1a1a22;
    border: 1px solid #2a2a35;
    color: #e6e6e6;
    padding: 5px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
  }
  .shift-select.shift-เช้า { color: #4caf6e; }
  .shift-select.shift-ดึก { color: #8a8aff; }
  .shift-select.shift-none { color: #d1a94a; }
  .shift-เช้า { background: #16331f; color: #4caf6e; }
  .shift-ดึก { background: #1a1a3a; color: #8a8aff; }
  .shift-none { background: #332a16; color: #d1a94a; }
  tr.unassigned { background: #1c1708; }
  .delete-btn {
    background: #3a1717;
    color: #e57373;
    border: none;
    padding: 5px 12px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
  }
  .delete-btn:hover { background: #4a1a1a; }
  .empty-msg { padding: 20px; text-align: center; color: #6f6f7d; font-size: 13px; }
  .status-msg { font-size: 13px; margin: 10px 0; min-height: 18px; }
  .status-msg.error { color: #e57373; }
  .status-msg.success { color: #4caf6e; }
  .cat-section { margin: 24px 0 10px; }
  .cat-title { font-size: 14px; font-weight: 600; color: #c9c9d6; display: flex; align-items: center; gap: 8px; margin: 0 0 10px; }
  .cat-count { font-size: 11px; color: #6f6f7d; font-weight: 500; }
</style>
</head>
<body>

<div class="content">
  <a href="/" class="back-link">← กลับหน้าแดชบอร์ด</a>
  <h1 style="margin-top:8px;">⚙️ แก้ไขกะพนักงาน</h1>
  <p style="font-size:13px; color:#9a9aa8; margin:6px 0 0;">คนที่กดสถานะเข้ามาจะขึ้นทะเบียนอัตโนมัติในหมวด "ยังไม่เลือกกะ" — เลือกกะให้ที่นี่ได้เลย หรือจะเพิ่มมือจาก dropdown ด้านล่างก็ได้</p>

  <div class="add-form">
    <input list="username-options" id="username-input" placeholder="พิมพ์หรือเลือกชื่อ">
    <datalist id="username-options"></datalist>
    <select id="shift-input">
      <option value="เช้า">เช้า</option>
      <option value="ดึก">ดึก</option>
    </select>
    <button>บันทึก</button>
  </div>

  <div class="status-msg" id="status-msg"></div>

  <div id="sections"></div>
</div>

<script>
// กันชื่อผู้ใช้ที่มีอักขระ HTML รันสคริปต์ (stored XSS)
function esc(v){ return String(v==null?"":v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function setMsg(text, ok){
  const el = document.getElementById("status-msg");
  el.textContent = text;
  el.className = "status-msg " + (ok ? "success" : "error");
}

// คนที่ยังไม่ได้เลือกกะ (shift เป็น null จากระบบขึ้นทะเบียนอัตโนมัติ) ต้องบังคับเลือกเช้า/ดึกก่อนถึงจะบันทึกได้
function rowHtml(a) {
  const hasShift = a.shift === "เช้า" || a.shift === "ดึก";
  const options = hasShift
    ? `<option value="เช้า" ${a.shift === "เช้า" ? "selected" : ""}>เช้า</option>
       <option value="ดึก" ${a.shift === "ดึก" ? "selected" : ""}>ดึก</option>`
    : `<option value="" disabled selected>ยังไม่เลือกกะ</option>
       <option value="เช้า">เช้า</option>
       <option value="ดึก">ดึก</option>`;
  return `
    <tr class="${hasShift ? "" : "unassigned"}">
      <td>${esc(a.username)}</td>
      <td>
        <select class="shift-select shift-${hasShift ? esc(a.shift) : "none"}" data-username="${esc(a.username)}">
          ${options}
        </select>
      </td>
      <td><button class="delete-btn" data-username="${esc(a.username)}">ลบ</button></td>
    </tr>`;
}

async function loadAssignments() {
  const res = await fetch("/api/shift-assignments");
  const data = await res.json();

  const datalist = document.getElementById("username-options");
  datalist.innerHTML = data.known_usernames.map(u => `<option value="${esc(u)}"></option>`).join("");

  const sections = document.getElementById("sections");
  if (data.assignments.length === 0) {
    sections.innerHTML = `<div class="table-wrap"><div class="empty-msg">ยังไม่มีรายชื่อ เริ่มเพิ่มได้จากฟอร์มด้านบน หรือรอให้ระบบขึ้นทะเบียนอัตโนมัติตอนมีคนกดสถานะ</div></div>`;
    return;
  }

  // จัดกลุ่มตามหมวดหมู่ (OD/FT/AM/...) — ในแต่ละหมวด เอาคน "ยังไม่เลือกกะ" ขึ้นก่อนเสมอ
  const byCat = {};
  data.assignments.forEach(a => { (byCat[a.category] = byCat[a.category] || []).push(a); });
  const catOrder = [...(data.categories || []), "อื่นๆ"].filter(c => byCat[c] && byCat[c].length);

  sections.innerHTML = catOrder.map(cat => {
    const rows = [...byCat[cat]].sort((x, y) => {
      const ux = (x.shift === "เช้า" || x.shift === "ดึก") ? 1 : 0;
      const uy = (y.shift === "เช้า" || y.shift === "ดึก") ? 1 : 0;
      if (ux !== uy) return ux - uy;
      return x.username.localeCompare(y.username);
    });
    const unassignedCount = rows.filter(a => a.shift !== "เช้า" && a.shift !== "ดึก").length;
    return `
      <div class="cat-section">
        <h2 class="cat-title">${esc(cat)} <span class="cat-count">${rows.length} คน${unassignedCount ? ` · ${unassignedCount} ยังไม่เลือกกะ` : ""}</span></h2>
        <div class="table-wrap">
          <table>
            <thead><tr><th>ชื่อ</th><th>กะ</th><th></th></tr></thead>
            <tbody>${rows.map(rowHtml).join("")}</tbody>
          </table>
        </div>
      </div>`;
  }).join("");

  sections.querySelectorAll("select[data-username]").forEach(sel => {
    sel.addEventListener("change", () => changeShift(sel.dataset.username, sel.value));
  });
  sections.querySelectorAll("button[data-username]").forEach(btn => {
    btn.addEventListener("click", () => deleteAssignment(btn.dataset.username));
  });
}

async function changeShift(username, newShift) {
  try {
    const res = await fetch("/api/shift-assignments", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, shift: newShift }),
    });
    if (!res.ok) throw new Error("บันทึกไม่สำเร็จ");
    setMsg(`เปลี่ยน ${username} เป็นกะ${newShift} แล้ว`, true);
    loadAssignments();
  } catch (err) {
    setMsg("เกิดข้อผิดพลาด: " + err.message, false);
  }
}

async function saveAssignment() {
  const username = document.getElementById("username-input").value.trim();
  const shift = document.getElementById("shift-input").value;

  if (!username) {
    setMsg("กรุณาเลือกหรือพิมพ์ชื่อก่อน", false);
    return;
  }

  try {
    const res = await fetch("/api/shift-assignments", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, shift }),
    });
    if (!res.ok) throw new Error("บันทึกไม่สำเร็จ");
    setMsg(`บันทึก ${username} เป็นกะ${shift} แล้ว`, true);
    document.getElementById("username-input").value = "";
    loadAssignments();
  } catch (err) {
    setMsg("เกิดข้อผิดพลาด: " + err.message, false);
  }
}

async function deleteAssignment(username) {
  if (!confirm(`ลบรายชื่อ ${username} ออกจากตารางกะ?`)) return;
  await fetch(`/api/shift-assignments/${encodeURIComponent(username)}`, { method: "DELETE" });
  loadAssignments();
}

document.querySelector(".add-form button").addEventListener("click", saveAssignment);
loadAssignments();
</script>

</body>
</html>
