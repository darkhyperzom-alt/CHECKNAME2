<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สถานะพนักงาน</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Tahoma", "Segoe UI", sans-serif;
    background: #100a1c;
    margin: 0; padding: 24px;
    color: #e6e0f0;
    min-height: 100vh;
    overflow-x: hidden;
  }
  @keyframes fadeSlide { from {opacity:0; transform:translateY(6px);} to {opacity:1; transform:translateY(0);} }
  @keyframes pulseRed { 0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0.35);} 50%{box-shadow:0 0 0 6px rgba(239,68,68,0);} }
  @keyframes livePulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
  @keyframes shimmer { 0%{background-position:-200% 0;} 100%{background-position:200% 0;} }
  @keyframes fall { from{transform:translateY(0) rotate(0);} to{transform:translateY(110vh) rotate(360deg);} }
  @keyframes badgePulse { 0%,100%{box-shadow:0 0 0 0 rgba(248,113,113,0.5);} 50%{box-shadow:0 0 0 5px rgba(248,113,113,0.1);} }

  .bg-emoji { position:fixed; top:-40px; opacity:0.35; pointer-events:none; animation:fall linear infinite; z-index:0; }
  .content { position:relative; z-index:1; max-width:1120px; margin:0 auto; }

  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:12px; }
  .title-wrap { display:flex; align-items:center; gap:10px; }
  .title { font-size:19px; font-weight:500;
    background:linear-gradient(90deg,#c4b5fd,#8b5cf6,#c4b5fd); background-size:200% auto;
    -webkit-background-clip:text; background-clip:text; color:transparent; animation:shimmer 4s linear infinite; }
  .live { display:inline-flex; align-items:center; gap:5px; background:#1a2e1f; color:#4ade80; font-size:11px; padding:3px 10px; border-radius:999px; }
  .live.off { background:#2e1420; color:#f87171; }
  .live .dot { width:6px; height:6px; border-radius:50%; background:currentColor; animation:livePulse 1.5s ease infinite; }
  .header-right { display:flex; align-items:center; gap:10px; }
  .shift-seg { display:flex; background:#1c1430; border-radius:999px; padding:3px; }
  .shift-btn { font-size:12px; padding:5px 13px; border-radius:999px; color:#a094c0; cursor:pointer; border:none; background:transparent; font-family:inherit; transition:all 0.2s ease; }
  .shift-btn.active { background:#8b5cf6; color:#fff; font-weight:500; }
  .shift-btn:hover:not(.active) { color:#c4b5fd; }
  .edit-link { font-size:12px; color:#a094c0; text-decoration:none; display:flex; align-items:center; gap:4px; padding:6px 12px; border:1px solid #2d2145; border-radius:999px; transition:all 0.2s ease; background:none; cursor:pointer; font-family:inherit; }
  .edit-link:hover { border-color:#8b5cf6; color:#c4b5fd; }
  #checkin-lock-btn.unlocked { border-color:#f87171; color:#f87171; background:#2e1420; }
  #checkin-lock-btn.unlocked:hover { border-color:#f87171; color:#fca5a5; }
  .updated { font-size:11px; color:#6b5f8a; }

  /* ล็อกไม่ให้กดเช็คชื่อพลาด — ต้องกดปลดล็อกก่อนปุ่ม + ถึงจะกดติด (กันเผลอกดตอนแค่ดูจอ) */
  body.checkin-locked .ci-btn { opacity:0.35; cursor:not-allowed; }

  .summary { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:11px; margin-bottom:20px; }
  .sum-card { background:linear-gradient(145deg,#1e1533,#160f28); border:1px solid #2d2145; border-radius:13px; padding:14px 16px; transition:transform 0.2s ease, border-color 0.2s ease; cursor:pointer; }
  .sum-card:hover { transform:translateY(-2px); border-color:#8b5cf6; }
  .sum-card .label { font-size:12px; color:#9d8fc4; margin-bottom:4px; }
  .sum-card .value { font-size:24px; font-weight:500; color:#fff; }

  .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .modal-backdrop[hidden] { display:none; }
  .modal-box { background:#160f28; border:1px solid #2d2145; border-radius:14px; width:min(480px,100%); max-height:80vh; overflow:hidden; display:flex; flex-direction:column; }
  .modal-head { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 18px; border-bottom:1px solid #241b38; font-size:14px; font-weight:600; color:#fff; }
  .modal-close { background:none; border:none; color:#9d8fc4; font-size:15px; cursor:pointer; padding:4px 9px; border-radius:6px; }
  .modal-close:hover { background:#241b38; color:#fff; }
  .modal-body { overflow-y:auto; padding:4px 0; }
  .modal-row { display:flex; align-items:center; gap:10px; padding:9px 18px; border-top:1px solid #1c1430; font-size:13px; }
  .modal-row:first-child { border-top:none; }
  .modal-empty { padding:26px 18px; text-align:center; color:#6b5f8a; font-size:13px; }

  .alert-box { background:#1a0f1a; border:1px solid #4a1e2a; border-radius:13px; overflow:hidden; margin-bottom:14px; animation:pulseRed 2.5s ease infinite; }
  .alert-head { background:#2e1420; color:#f87171; font-size:12px; font-weight:500; padding:8px 16px; display:flex; align-items:center; gap:6px; }

  .table-wrap { background:#160f28; border:1px solid #2d2145; border-radius:13px; overflow:hidden; }
  table { width:100%; border-collapse:collapse; font-size:13px; table-layout:fixed; }
  th { background:#1c1430; color:#9d8fc4; font-weight:500; padding:10px 16px; text-align:left; }
  th:nth-child(1),td:nth-child(1){ width:28%; }
  th:nth-child(2),td:nth-child(2){ width:15%; text-align:center; }
  th:nth-child(3),td:nth-child(3){ width:15%; text-align:right; }
  th:nth-child(4),td:nth-child(4){ width:22%; text-align:center; }
  th:nth-child(5),td:nth-child(5){ width:20%; text-align:right; }
  tbody tr { border-top:1px solid #241b38; transition:background 0.25s ease; }
  tbody tr:hover { background:#241b38; }
  td { padding:11px 16px; }
  td:first-child { padding-left:13px; }
  .uname { font-weight:500; color:#fff; }

  .ci-icons { display:inline-flex; gap:4px; align-items:center; }
  .ci { display:inline-flex; width:21px; height:21px; border-radius:50%; align-items:center; justify-content:center; font-size:11px; border:none; padding:0; font-family:inherit; cursor:pointer; transition:all 0.15s ease; }
  .ci-green { background:#1a2e1f; color:#4ade80; }
  .ci-green:hover { background:#8b5cf6; color:#fff; transform:scale(1.1); }
  .ci-red { background:#2e1420; color:#f87171; }
  .ci-gray { background:#241b38; color:#6b5f8a; }
  .ci-btn { width:21px; height:21px; border-radius:50%; padding:0; font-size:11px; background:#2d2145; color:#c4b5fd; border:none; cursor:pointer; transition:all 0.15s ease; display:inline-flex; align-items:center; justify-content:center; }
  .ci-btn:hover { background:#8b5cf6; color:#fff; transform:scale(1.1); }
  .ci-wide { display:inline-flex; padding:2px 9px; border-radius:999px; font-size:10px; border:none; font-family:inherit; }
  .ci-offshift { background:#241b38; color:#6b5f8a; }
  .ci-dayoff { background:#33280f; color:#fbbf24; }
  .ci-holiday { background:#33280f; color:#fbbf24; cursor:pointer; transition:background 0.15s ease; }
  .ci-holiday:hover { background:#493713; }
  .ci-time { font-size:9px; color:#4ade80; font-family:monospace; }

  .badge { display:inline-flex; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:500; }
  .b-back { background:#1a2e1f; color:#4ade80; }
  .b-heavy { background:#2e1420; color:#f87171; }
  .b-light { background:#33280f; color:#fbbf24; }
  .b-food { background:#33280f; color:#fbbf24; }
  .b-over { background:#3a1015; color:#ff6b6b; animation:badgePulse 1.2s ease infinite; }

  .tcell { font-family:monospace; color:#c4b5fd; }
  .tcell.idle { color:#6b5f8a; font-family:inherit; }
  .tcell.over { color:#ff6b6b; font-weight:500; }
  .total { font-family:monospace; color:#6b5f8a; }
  .dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
</style>
</head>
<body>

<div class="content">
  <div class="header">
    <div class="title-wrap">
      <i class="ti ti-clipboard-list" style="font-size:22px; color:#a78bfa;" aria-hidden="true"></i>
      <span class="title">สถานะพนักงานวันนี้</span>
      <span class="live" id="live-badge"><span class="dot"></span> เรียลไทม์</span>
    </div>
    <div class="header-right">
      <div class="shift-seg" id="category-seg"></div>
      <button class="edit-link" id="checkin-lock-btn" onclick="toggleCheckinLock()"></button>
      <a href="/shift-calendar" class="edit-link"><i class="ti ti-calendar" aria-hidden="true"></i> ตารางกะ</a>
      <span class="updated" id="updated"></span>
    </div>
  </div>

  <div class="summary" id="summary"></div>
  <div id="alert-zone"></div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>ผู้ใช้</th>
          <th>เช็คชื่อ</th>
          <th>เวลา</th>
          <th>สถานะ</th>
          <th>รวมวันนี้</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>
</div>

<div class="modal-backdrop" id="detail-modal-backdrop" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <span id="detail-modal-title"></span>
      <button class="modal-close" id="detail-modal-close" aria-label="ปิด">✕</button>
    </div>
    <div class="modal-body" id="detail-modal-body"></div>
  </div>
</div>

<script>
const FLOAT_EMOJIS = ["✨","🌟","💜","🔮","⭐"];
function spawnEmoji(){
  const el=document.createElement("div"); el.className="bg-emoji";
  el.textContent=FLOAT_EMOJIS[Math.floor(Math.random()*FLOAT_EMOJIS.length)];
  el.style.left=Math.random()*100+"vw";
  const d=10+Math.random()*12; el.style.animationDuration=d+"s";
  el.style.fontSize=(16+Math.random()*12)+"px";
  document.body.appendChild(el); setTimeout(()=>el.remove(),d*1000);
}
setInterval(spawnEmoji,1400);
for(let i=0;i<5;i++) setTimeout(spawnEmoji,i*400);

const OVERTIME_LIMITS={"ปวดหนัก":20*60,"ปวดน้อย":6*60,"กินข้าว":30*60};
const overtimeAlerted=new Set(), warningAlerted=new Set();
let selectedCategory="ทั้งหมด", latestData=null, dataReceivedAt=0, eventSource=null;
let lastSig=null, lastRenderAt=0;

// ล็อกไว้เป็นค่าเริ่มต้นเสมอทุกครั้งที่เปิด/รีเฟรชหน้า กันเผลอกดปุ่ม + ตอนแค่ดูจอเฉยๆ
let checkinUnlocked=false;
function renderCheckinLockUI(){
  document.body.classList.toggle("checkin-locked",!checkinUnlocked);
  const btn=document.getElementById("checkin-lock-btn");
  btn.classList.toggle("unlocked",checkinUnlocked);
  btn.innerHTML=checkinUnlocked
    ? '<i class="ti ti-lock-open" aria-hidden="true"></i> ปลดล็อกเช็คชื่ออยู่'
    : '<i class="ti ti-lock" aria-hidden="true"></i> ล็อกเช็คชื่ออยู่';
}
function toggleCheckinLock(){
  checkinUnlocked=!checkinUnlocked;
  renderCheckinLockUI();
}
renderCheckinLockUI();

// เสียงเตือนแยก 2 ภาษา — ชื่อ (ODOL/AMOL/... + ชื่อเล่น) อ่านด้วยเสียงอังกฤษ เพราะชื่อคนมีเป็นร้อยคน
// ทำตารางคำอ่านไทยให้ครบทุกคนไม่ไหว เสียงอังกฤษอ่านชื่อได้ถูกต้องเองโดยไม่ต้องเทียบเสียงทีละคน
// ส่วนประโยคเตือนอ่านด้วยเสียงไทย ต่อกันเป็น utterance คนละตัว (คิวเล่นเรียงกันอัตโนมัติ)
let cachedThaiVoice=null, cachedEnglishVoice=null;
function pickVoiceByLang(prefix){
  const v=window.speechSynthesis.getVoices();
  if(!v||!v.length) return null;
  const matched=v.filter(x=>x.lang&&x.lang.toLowerCase().startsWith(prefix));
  if(!matched.length) return null;
  return matched.find(x=>x.name.toLowerCase().includes("google"))||matched[0];
}
function refreshCachedVoices(){
  cachedThaiVoice=pickVoiceByLang("th");
  cachedEnglishVoice=pickVoiceByLang("en");
}
if(window.speechSynthesis){ refreshCachedVoices(); window.speechSynthesis.onvoiceschanged=refreshCachedVoices; }

function makeUtterance(text, voice, lang, rate){
  const u=new SpeechSynthesisUtterance(text);
  u.lang=lang;
  if(voice) u.voice=voice;
  u.rate=rate;
  u.onerror=(e)=>console.error("พูดไม่สำเร็จ",e.error);
  return u;
}
// เว้นวรรคทุกตัวอักษร บังคับให้ TTS สะกดทีละตัว (O D O L) แทนที่จะพยายามอ่านเป็นคำ
function spellOut(s){ return String(s||"").split("").join(" "); }

function announceOvertimeFallback(username, activity, alreadyOver){
  try{
    // เช็คเสียงสดอีกทีตอนพูดจริง กันเคสหน้าเว็บโหลดเสร็จก่อนเบราว์เซอร์โหลดลิสต์เสียงเสร็จ
    const enVoice=pickVoiceByLang("en")||cachedEnglishVoice;
    const thVoice=pickVoiceByLang("th")||cachedThaiVoice;
    const parts=username.split("-");
    const englishText=`${spellOut(parts[0]||"")}, ${parts[1]||""}`;
    const thaiText=alreadyOver
      ? `เกินเวลาสำหรับ${activity}นี้แล้ว กรุณากลับที่นั่งโดยเร็วที่สุด`
      : `จะเกินเวลาสำหรับ${activity}นี้แล้ว กรุณากลับที่นั่งโดยเร็วที่สุด`;
    window.speechSynthesis.cancel();
    setTimeout(()=>{
      window.speechSynthesis.speak(makeUtterance(englishText, enVoice, "en-US", 0.9));
      window.speechSynthesis.speak(makeUtterance(thaiText, thVoice, "th-TH", 0.85));
    },80);
  }catch(e){ console.error("announceOvertimeFallback error",e); }
}

// เสียงเบราว์เซอร์เป็นหลักไปก่อน — ลอง ElevenLabs แล้วเสียง premade ที่ใช้ผ่าน API ได้ฟรีเป็นเสียงฝรั่งล้วน
// พูดไทยไม่รู้เรื่องเลย (ส่วนเสียง Library ที่มีให้เลือกหลากหลาย/มีเสียงไทย ใช้ผ่าน API ไม่ได้ในแพ็กฟรี)
// เก็บ announceOvertimeElevenLabs() ไว้เผื่ออนาคตอัปเกรดแพ็ก/เจอเสียงที่ใช้ได้ — ไม่ได้ถูกเรียกอัตโนมัติตอนนี้
function announceOvertime(username, activity, alreadyOver){
  announceOvertimeFallback(username, activity, alreadyOver);
}
async function announceOvertimeElevenLabs(username, activity, alreadyOver){
  try{
    const params=new URLSearchParams({ username, activity, already_over: alreadyOver ? "1" : "0" });
    const res=await fetch(`/api/tts?${params}`);
    if(!res.ok) throw new Error("tts endpoint failed");
    const blob=await res.blob();
    const url=URL.createObjectURL(blob);
    const audio=new Audio(url);
    audio.addEventListener("ended",()=>URL.revokeObjectURL(url));
    await audio.play();
  }catch(err){
    console.error("ElevenLabs TTS ไม่สำเร็จ ใช้เสียงเบราว์เซอร์แทน",err);
    announceOvertimeFallback(username, activity, alreadyOver);
  }
}
function speakAlert(n,a){ announceOvertime(n,a,true); }
function speakWarning(n,a){ announceOvertime(n,a,false); }

// กันชื่อผู้ใช้ที่มีอักขระ HTML (เช่น <img onerror=...>) รันสคริปต์บนหน้าเว็บ
function esc(v){ return String(v==null?"":v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function badgeClass(s){ return s==="กลับที่นั่ง"?"b-back":s==="ปวดหนัก"?"b-heavy":s==="ปวดน้อย"?"b-light":s==="กินข้าว"?"b-food":""; }
function fmtDur(sec){ sec=Math.max(0,Math.floor(sec)); const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60; return [h,m,s].map(v=>String(v).padStart(2,"0")).join(":"); }
function fmtAgo(sec){ const m=Math.floor(sec/60); return m<1?"กลับมาเมื่อสักครู่":`กลับมา ${m} นาทีที่แล้ว`; }

async function manualCheckin(userId, round){
  if(!checkinUnlocked){
    // ล็อกไว้เป็นค่าเริ่มต้น กันเผลอกดปุ่ม + ตอนแค่ดูจอ ต้องกดปลดล็อกที่ปุ่มบนหัวก่อนเสมอ
    alert("ต้องกดปลดล็อกเช็คชื่อ (ปุ่มบนหัวจอ) ก่อน ถึงจะกดเช็คชื่อมือได้ — กันเผลอกดพลาด");
    return;
  }
  try{
    const res=await fetch("/api/manual-checkin",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user_id:userId,round:round,shift:null})});
    if(!res.ok){
      // เช่น กดข้ามลำดับ (รอบ 2/3 ก่อนรอบก่อนหน้าจะประกาศ) — เดิม fetch ไม่ throw ตอน backend ตอบ error
      // ทำให้กดแล้วเงียบ ไม่มีอะไรเกิดขึ้น ไม่รู้ว่าทำไมไม่ขึ้นเขียว
      const err=await res.json().catch(()=>({}));
      alert(err.error||"เช็คชื่อไม่สำเร็จ");
      return;
    }
    loadData();
  }catch(e){ console.error("เช็คชื่อมือไม่สำเร็จ",e); }
}

async function undoCheckin(userId, round, username){
  if(!checkinUnlocked){
    alert("ต้องกดปลดล็อกเช็คชื่อ (ปุ่มบนหัวจอ) ก่อน ถึงจะยกเลิกเช็คชื่อได้ — กันเผลอกดพลาด");
    return;
  }
  if(!confirm(`ยกเลิกเช็คชื่อรอบ ${round} ของ ${username}?`)) return;
  try{
    const res=await fetch("/api/manual-checkin",{method:"DELETE",headers:{"Content-Type":"application/json"},body:JSON.stringify({user_id:userId,round:round,shift:null})});
    if(!res.ok){
      const err=await res.json().catch(()=>({}));
      alert(err.error||"ยกเลิกเช็คชื่อไม่สำเร็จ");
      return;
    }
    loadData();
  }catch(e){ console.error("ยกเลิกเช็คชื่อไม่สำเร็จ",e); }
}

// event delegation (ผูกครั้งเดียวตอนโหลดหน้า) — เพราะตาราง re-render บ่อยจาก SSE ถ้าผูกใหม่ทุกครั้งจะรั่ว/ซ้ำ
// ใช้ data-attribute แทนการยัด username ลง onclick ตรงๆ กัน username ที่มีเครื่องหมาย ' หลุดออกจาก JS string ได้ (stored XSS)
document.getElementById("table-body").addEventListener("click",(e)=>{
  const btn=e.target.closest("[data-undo]");
  if(!btn) return;
  undoCheckin(btn.dataset.userId, parseInt(btn.dataset.round,10), btn.dataset.username);
});

// การ์ดสรุปด้านบน กดดูรายละเอียดรายคนได้ — "ออกนอกที่นั่ง" อ่านจากข้อมูลที่มีอยู่แล้ว (สด/ไม่ต้องยิง request)
// ส่วนการ์ดกิจกรรม (ปวดหนัก/ปวดน้อย/กินข้าว ฯลฯ) ต้องยิง /api/activity-detail เพราะต้องรวมยอดครั้ง/เวลาย้อนทั้งรอบกะ
let detailModalKind=null, detailRefreshTimer=null;

function closeDetailModal(){
  document.getElementById("detail-modal-backdrop").hidden=true;
  detailModalKind=null;
  if(detailRefreshTimer){ clearInterval(detailRefreshTimer); detailRefreshTimer=null; }
}
document.getElementById("detail-modal-close").addEventListener("click",closeDetailModal);
document.getElementById("detail-modal-backdrop").addEventListener("click",(e)=>{
  if(e.target.id==="detail-modal-backdrop") closeDetailModal();
});

function renderOutNowModal(){
  if(!latestData) return;
  const scoped=selectedCategory==="ทั้งหมด"?latestData.people:latestData.people.filter(p=>p.category===selectedCategory);
  const outPeople=scoped.filter(p=>p.status!=="กลับที่นั่ง").sort((a,b)=>b.duration_seconds-a.duration_seconds);
  document.getElementById("detail-modal-title").textContent=`ออกนอกที่นั่งตอนนี้ (${outPeople.length} คน)`;
  const body=document.getElementById("detail-modal-body");
  body.innerHTML=outPeople.length ? outPeople.map(p=>`
    <div class="modal-row">
      <span class="uname" style="flex:1;">${esc(p.username)}</span>
      <span class="badge ${badgeClass(p.status)}">${esc(p.status)}</span>
      <span class="tcell" data-countdown="${p.duration_seconds||0}" style="width:70px;text-align:right;">${fmtDur(p.duration_seconds||0)}</span>
    </div>`).join("") : `<div class="modal-empty">ไม่มีใครออกนอกที่นั่งตอนนี้</div>`;
}

function openOutNowModal(){
  if(!latestData) return;
  detailModalKind="outnow";
  document.getElementById("detail-modal-backdrop").hidden=false;
  renderOutNowModal();
}

async function fetchAndRenderActivityModal(activity){
  try{
    const params=new URLSearchParams({activity, category:selectedCategory});
    const res=await fetch(`/api/activity-detail?${params}`);
    const data=await res.json();
    const people=(data.people||[]);
    document.getElementById("detail-modal-title").textContent=`${activity}วันนี้ — รายคน`;
    const body=document.getElementById("detail-modal-body");
    body.innerHTML=people.length ? people.map(p=>`
      <div class="modal-row">
        <span class="uname" style="flex:1;">${esc(p.username)}</span>
        <span style="color:#9d8fc4;width:56px;text-align:right;">${p.count} ครั้ง</span>
        <span class="tcell" style="width:70px;text-align:right;">${fmtDur(p.total_seconds)}</span>
      </div>`).join("") : `<div class="modal-empty">ยังไม่มีใครกดวันนี้</div>`;
  }catch(e){ console.error("โหลดรายละเอียดไม่สำเร็จ",e); }
}

function openActivityModal(activity){
  detailModalKind="activity";
  document.getElementById("detail-modal-backdrop").hidden=false;
  document.getElementById("detail-modal-title").textContent=`${activity}วันนี้ — รายคน`;
  document.getElementById("detail-modal-body").innerHTML=`<div class="modal-empty">กำลังโหลด...</div>`;
  fetchAndRenderActivityModal(activity);
  if(detailRefreshTimer) clearInterval(detailRefreshTimer);
  detailRefreshTimer=setInterval(()=>fetchAndRenderActivityModal(activity),5000);
}

document.getElementById("summary").addEventListener("click",(e)=>{
  const card=e.target.closest(".sum-card");
  if(!card) return;
  if(card.dataset.kind==="outnow") openOutNowModal();
  else if(card.dataset.kind==="activity") openActivityModal(card.dataset.activity);
});

function ciIconHtml(round, roundNum, userId, username){
  if(round.status==="green") return `<button class="ci ci-green" title="รอบ ${roundNum}${round.time?' · '+round.time:''} — กดเพื่อยกเลิก" data-undo data-user-id="${userId}" data-round="${roundNum}" data-username="${esc(username)}"><i class="ti ti-check" aria-hidden="true"></i></button>`;
  if(round.status==="red") return `<button class="ci-btn" title="กดเพื่อเช็คชื่อรอบ ${roundNum}" onclick="manualCheckin('${userId}',${roundNum})"><i class="ti ti-plus" aria-hidden="true"></i></button>`;
  return `<button class="ci-btn" style="background:#241b38;color:#6b5f8a;" title="ยังไม่ประกาศ — กดเพื่อเช็คชื่อรอบ ${roundNum}" onclick="manualCheckin('${userId}',${roundNum})">·</button>`;
}

// หมวดหมู่กรองคนแสดงผล — เป็นแค่ตัวกรองฝั่งจอ ไม่ต้องยิง request ใหม่ (ข้อมูลทุกหมวดมากับ payload เดียวกันอยู่แล้ว)
let lastCatTabs=null;
function renderCategoryTabs(data){
  const hasOther=data.people.some(p=>p.category==="อื่นๆ");
  const tabs=["ทั้งหมด",...(data.categories||[]),...(hasOther?["อื่นๆ"]:[])];
  const key=tabs.join("|");
  if(key===lastCatTabs){
    // แค่อัปเดตปุ่มไหน active ไม่ต้องสร้าง DOM ใหม่ทั้งก้อน (กันโฟกัส/hover กระพริบ)
    document.querySelectorAll("#category-seg .shift-btn").forEach(b=>b.classList.toggle("active",b.dataset.cat===selectedCategory));
    return;
  }
  lastCatTabs=key;
  document.getElementById("category-seg").innerHTML=tabs.map(t=>
    `<button class="shift-btn${t===selectedCategory?" active":""}" data-cat="${esc(t)}">${esc(t)}</button>`
  ).join("");
  document.querySelectorAll("#category-seg .shift-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      selectedCategory=btn.dataset.cat;
      document.querySelectorAll("#category-seg .shift-btn").forEach(b=>b.classList.toggle("active",b===btn));
      if(latestData) renderToDOM(latestData);
    });
  });
}

// ลายเซ็นของ "เนื้อหาจริง" ไม่รวมตัวเลขเวลาที่เดินอยู่ตลอด (นับใหม่ทุกวิจะกระพริบ)
// แต่รวมสถานะ "เกิน/ใกล้เกินเวลา" ไว้ด้วย เพราะเป็นค่าที่ต้องอัปเดต badge/กล่องเตือน/เสียงพูดทันทีที่เปลี่ยน
// (เดิมไม่รวม ทำให้ค้างได้นานสุด 30 วิ ถึงจะขึ้นแดง/มีเสียงเตือน ทั้งที่ตัวเลขเวลาในตารางเกินไปแล้ว)
function sigOf(d){
  return JSON.stringify([d.current_shift, d.summary_by_category,
    d.people.map(p=>{
      const lim=OVERTIME_LIMITS[p.status];
      const isOT=p.status!=="กลับที่นั่ง"&&lim&&p.duration_seconds>lim;
      const isNear=p.status!=="กลับที่นั่ง"&&lim&&!isOT&&p.duration_seconds>=(lim-60);
      return [p.user_id,p.username,p.status,p.since,isOT,isNear,
        p.checkin?[p.checkin.round1.status,p.checkin.round1.time,
                   p.checkin.round2.status,p.checkin.round2.time,
                   p.checkin.round3.status,p.checkin.round3.time]:null];
    })]);
}

function renderData(data){
  if(!data) return;
  const sig=sigOf(data);
  // ถ้าเปลี่ยนแค่ตัวเลขเวลา ไม่ต้องวาดตารางใหม่ ปล่อยให้ timer ในเบราว์เซอร์เดินเอง
  // (บังคับวาดใหม่อย่างน้อยทุก 30 วิ เผื่อรอบกะรีเซ็ต)
  if(sig===lastSig && Date.now()-lastRenderAt<30000) return;
  lastSig=sig; lastRenderAt=Date.now(); dataReceivedAt=Date.now();
  renderToDOM(data);
}

function renderToDOM(data){
  try{
    renderCategoryTabs(data);

    // การ์ดสรุปตรงกับหมวดที่กำลังเปิดดูอยู่ (เซิร์ฟเวอร์คำนวณแยกไว้ให้ทุกหมวดแล้ว รวมทั้งคำนวณ "ทั้งหมด" ไว้ให้ด้วย)
    const summary=data.summary_by_category[selectedCategory]||{out_now:0,activity_counts_today:{}};
    document.getElementById("summary").innerHTML=`
      <div class="sum-card" data-kind="outnow"><div class="label">ออกนอกที่นั่ง</div><div class="value">${summary.out_now}</div></div>
      ${Object.entries(summary.activity_counts_today).map(([a,c])=>`<div class="sum-card" data-kind="activity" data-activity="${esc(a)}"><div class="label">${esc(a)}วันนี้</div><div class="value">${c} ครั้ง</div></div>`).join("")}`;

    // แท็บหมวดหมู่กรองทุกอย่างตั้งแต่ตรงนี้ — ตาราง, โซนเตือน, เสียงแจ้งเตือน ล้วนอยู่ในหมวดที่กำลังดูอยู่เท่านั้น
    const scoped=selectedCategory==="ทั้งหมด"?data.people:data.people.filter(p=>p.category===selectedCategory);
    const people=[...scoped].sort((a,b)=>{
      const pr=p=>{ if(!p.checkin)return 0; if(p.checkin.round1.status==="offshift"||p.checkin.round1.status==="dayoff")return 2; if(p.checkin.round1.status==="holiday")return 1; return 0; };
      const pa=pr(a),pb=pr(b); if(pa!==pb) return pa-pb;
      const aa=a.status!=="กลับที่นั่ง",ba=b.status!=="กลับที่นั่ง";
      if(aa!==ba) return aa?-1:1;
      if(!aa&&!ba) return a.duration_seconds-b.duration_seconds;
      return 0;
    });

    const newOT=[],newW=[],curOT=new Set(),curW=new Set();
    people.forEach(p=>{
      const isBack=p.status==="กลับที่นั่ง", lim=OVERTIME_LIMITS[p.status];
      const isOT=!isBack&&lim&&p.duration_seconds>lim;
      const isNear=!isBack&&lim&&!isOT&&p.duration_seconds>=(lim-60);
      if(isOT){ curOT.add(p.user_id); if(!overtimeAlerted.has(p.user_id)) newOT.push({username:p.username,activity:p.status}); }
      else if(isNear){ curW.add(p.user_id); if(!warningAlerted.has(p.user_id)) newW.push({username:p.username,activity:p.status}); }
    });
    newW.forEach((p,i)=>setTimeout(()=>speakWarning(p.username,p.activity),i*3000));
    newOT.forEach((p,i)=>setTimeout(()=>speakAlert(p.username,p.activity),(newW.length+i)*3000));
    overtimeAlerted.clear(); curOT.forEach(x=>overtimeAlerted.add(x));
    warningAlerted.clear(); curW.forEach(x=>warningAlerted.add(x));

    function rowData(p){
      const isBack=p.status==="กลับที่นั่ง", lim=OVERTIME_LIMITS[p.status];
      const isOT=!isBack&&lim&&p.duration_seconds>lim;
      const label=isOT?`เกินเวลา${p.status}`:p.status;
      const bcls=isOT?"b-over":badgeClass(p.status);
      const warn=isOT?'<i class="ti ti-alert-triangle" style="font-size:10px;" aria-hidden="true"></i> ':"";
      const elapsed=Math.floor((Date.now()-dataReceivedAt)/1000);
      const dur=(p.duration_seconds||0)+elapsed;  // นับต่อทุกกรณี รวมคนที่กลับที่นั่งแล้ว
      const timeHtml=isBack?`<span class="tcell idle" data-countdown="${p.duration_seconds||0}" data-back="1">${fmtAgo(dur)}</span>`
        :isOT?`<span class="tcell over" data-countdown="${p.duration_seconds||0}" data-limit="${lim}">+${fmtDur(dur-lim)}</span>`
        :lim?`<span class="tcell" data-countdown="${p.duration_seconds||0}" data-limit="${lim}">${fmtDur(lim-dur)}</span>`
        :`<span class="tcell" data-countdown="${p.duration_seconds||0}">${fmtDur(dur)}</span>`;
      const isHoliday=p.checkin&&p.checkin.round1.status==="holiday";
      const isOff=p.checkin&&p.checkin.round1.status==="offshift";
      const isDayOff=p.checkin&&p.checkin.round1.status==="dayoff";
      let ci;
      if(!p.checkin) ci="";
      else if(isHoliday) ci=`<button class="ci-wide ci-holiday" title="กดเพื่อเช็คชื่อรอบ 1" onclick="manualCheckin('${p.user_id}',1)">วันหยุด</button>`;
      else if(isDayOff) ci=`<span class="ci-wide ci-dayoff">วันหยุดวันนี้</span>`;
      else if(isOff) ci=`<span class="ci-wide ci-offshift">ไม่ใช่กะนี้</span>`;
      else ci=`<span class="ci-icons">${ciIconHtml(p.checkin.round1,1,p.user_id,p.username)}${ciIconHtml(p.checkin.round2,2,p.user_id,p.username)}${ciIconHtml(p.checkin.round3,3,p.user_id,p.username)}</span>`;
      return {isOT, label, bcls, warn, timeHtml, ci, isBack};
    }

    // โซนเตือน (คนเกินเวลา/ใกล้เกิน)
    const alertPeople=people.filter(p=>{
      const lim=OVERTIME_LIMITS[p.status];
      return p.status!=="กลับที่นั่ง"&&lim&&p.duration_seconds>=(lim-60);
    });
    const az=document.getElementById("alert-zone");
    if(alertPeople.length){
      az.innerHTML=`<div class="alert-box"><div class="alert-head"><i class="ti ti-alert-triangle" aria-hidden="true"></i> ต้องดูก่อน · ${alertPeople.length} คน</div>
        ${alertPeople.map((p,i)=>{ const r=rowData(p); const lim=OVERTIME_LIMITS[p.status]; const isOT=p.duration_seconds>lim;
          return `<div style="display:flex;align-items:center;gap:14px;padding:11px 16px;border-top:1px solid #2d1520;">
            <span class="dot" style="background:${isOT?'#f87171':'#fbbf24'};"></span>
            <span class="uname" style="flex:1;font-size:13px;">${esc(p.username)}</span>
            ${r.ci}
            <span style="font-size:12px;color:${isOT?'#f87171':'#fbbf24'};width:90px;text-align:right;">${esc(p.status)}</span>
            <span class="tcell ${isOT?'over':''}" style="width:64px;text-align:right;">${isOT?'+'+fmtDur(p.duration_seconds-lim):fmtDur(lim-p.duration_seconds)}</span>
          </div>`; }).join("")}</div>`;
    } else az.innerHTML="";

    document.getElementById("table-body").innerHTML=people.map((p,i)=>{
      const r=rowData(p);
      const isActive=!r.isBack;
      const actColor=p.status==="ปวดหนัก"?"#f87171":p.status==="ปวดน้อย"?"#fbbf24":p.status==="กินข้าว"?"#fbbf24":"#8b5cf6";
      let rowStyle="";
      if(r.isOT){ rowStyle=`background:#1a0f14;border-left:3px solid #f87171;`; }
      else if(isActive){ rowStyle=`background:#1a1330;border-left:3px solid ${actColor};`; }
      else { rowStyle=`border-left:3px solid transparent;`; }
      if(p.checkin&&(p.checkin.round1.status==='offshift'||p.checkin.round1.status==='holiday'||p.checkin.round1.status==='dayoff')) rowStyle+="opacity:0.5;";
      return `<tr style="${rowStyle}">
        <td><span class="uname">${esc(p.username)}</span></td>
        <td>${r.ci}</td>
        <td>${r.timeHtml}</td>
        <td><span class="badge ${r.bcls}">${r.warn}${esc(r.label)}</span></td>
        <td><span class="total" data-total="${p.total_today_seconds||0}" data-active="${p.status!=="กลับที่นั่ง"?1:0}">${fmtDur((p.total_today_seconds||0)+(p.status!=="กลับที่นั่ง"?Math.floor((Date.now()-dataReceivedAt)/1000):0))}</span></td>
      </tr>`;
    }).join("");

    document.getElementById("updated").textContent="อัปเดต "+new Date().toLocaleTimeString("th-TH");

    if(detailModalKind==="outnow") renderOutNowModal();
  }catch(e){ console.error("แสดงผลไม่สำเร็จ",e); }
}

async function loadData(){
  try{
    const res=await fetch("/api/status"); const data=await res.json();
    latestData=data; renderData(data);
  }catch(e){ console.error("โหลดไม่สำเร็จ",e); }
}

function connectSSE(){
  if(eventSource) eventSource.close();
  eventSource=new EventSource("/api/stream");
  eventSource.onmessage=(e)=>{
    try{ latestData=JSON.parse(e.data); renderData(latestData);
      document.getElementById("live-badge").classList.remove("off");
      document.getElementById("live-badge").innerHTML='<span class="dot"></span> เรียลไทม์';
    }catch(err){}
  };
  eventSource.onerror=()=>{
    document.getElementById("live-badge").classList.add("off");
    document.getElementById("live-badge").innerHTML='<span class="dot"></span> กำลังต่อใหม่';
    // ถ้า browser ปิด stream แบบถาวร (เช่น proxy ตอบไม่ใช่ text/event-stream) มันจะไม่ auto-retry ให้เอง
    // ต้องเปิดใหม่มือ ไม่งั้นค้างคำว่า "กำลังต่อใหม่" ตลอดไปโดยไม่มีการต่อจริง
    if(eventSource && eventSource.readyState===EventSource.CLOSED){
      setTimeout(connectSSE,3000);
    }
  };
}

loadData().then(connectSSE);

// timer เดินเวลาเฉพาะตัวเลข ไม่ re-render ทั้งตาราง (ป้องกันกระพริบ)
setInterval(()=>{
  if(!latestData) return;
  const elapsed=Math.floor((Date.now()-dataReceivedAt)/1000);
  document.querySelectorAll("[data-countdown]").forEach(el=>{
    const base=parseInt(el.dataset.countdown), lim=parseInt(el.dataset.limit||"0"), isBack=el.dataset.back==="1";
    const dur=base+elapsed;  // นับต่อทุกกรณี รวมคนที่กลับที่นั่งแล้ว
    if(isBack){ el.textContent=fmtAgo(dur); }
    else if(lim && dur>lim){ el.textContent="+"+fmtDur(dur-lim); el.className="tcell over"; }
    else if(lim){ el.textContent=fmtDur(lim-dur); }
    else { el.textContent=fmtDur(dur); }
  });
  document.querySelectorAll("[data-total]").forEach(el=>{
    const base=parseInt(el.dataset.total), active=el.dataset.active==="1";
    el.textContent=fmtDur(base+(active?elapsed:0));
  });
},1000);
</script>
